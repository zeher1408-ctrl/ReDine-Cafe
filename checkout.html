<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | ReDine Café</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="/">ReDine <i>Café</i></a></header><main class="checkout"><section><p>SECURE CHECKOUT</p><h1>Almost there.</h1><form id="checkoutForm"><label>Full name<input name="name" required></label><label>Mobile number<input name="phone" required type="tel"></label><label>Email (optional)<input name="email" type="email"></label><label>Pickup / delivery address<textarea name="address" required placeholder="House / flat, landmark, area, city"></textarea></label><label>Fulfilment<select name="fulfilment"><option>Pickup from café</option><option>Delivery (confirm by WhatsApp)</option></select></label><label>Payment method<select name="payment"><option>UPI / Razorpay (coming soon)</option><option>Cash at pickup</option></select></label><label>Order notes<textarea name="notes" placeholder="E.g. less spicy"></textarea></label><button class="orange" type="submit">Review & place order →</button></form><p id="orderMessage"></p></section><aside><h2>Your order</h2><div data-cart-items></div><h2>Total: <span data-cart-total>₹0</span></h2><small>Razorpay is reserved for final payment integration. This demo sends the invoice details to WhatsApp.</small></aside></main><script src="app.js"></script><script>document.querySelector('#checkoutForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),text='Customer: '+f.get('name')+'\nPhone: '+f.get('phone')+'\nAddress: '+f.get('address')+'\nPayment: '+f.get('payment');window.open('https://wa.me/917264837759?text='+encodeURIComponent(text),'_blank')}</script></body></html>
