<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReDine Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.admin{max-width:1100px;margin:50px auto;padding:30px}.admin h1{font:800 32px 'Plus Jakarta Sans'}.admincard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}.adminhead{display:flex;justify-content:space-between;align-items:center}.reset{border:1px solid #edb9c3;color:#a5445b;background:#fff;border-radius:7px;padding:9px;font:700 11px 'DM Sans'}.table{overflow:auto}table{width:100%;min-width:700px;border-collapse:collapse;margin-top:20px}th{text-align:left;font-size:10px;color:var(--mut);padding:12px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line);font-size:12px}td input{border:1px solid var(--line);padding:8px;border-radius:6px;font:12px 'DM Sans';width:100%}td input[type=number]{width:90px}.note{color:#438467;font-size:11px}</style></head><body><div class="admin"><a href="index.html">← Back to ordering site</a><p class="tag" style="margin-top:35px">REDINE CAFÉ · CONTROL PANEL</p><h1>Menu management</h1><p>Change prices or switch items on/off. Updates are stored in this browser and immediately apply to the ordering page.</p><section class="admincard"><div class="adminhead"><div><h2>Menu inventory</h2><span class="note" id="note">All changes save automatically</span></div><button class="reset" id="reset">Restore original menu</button></div><div class="table"><table><thead><tr><th>Category</th><th>Item</th><th>Price (₹)</th><th>Available</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script>const base=[['Maggi','Plain Maggi',39],['Maggi','Masala Maggi',60],['Maggi','Cheese Maggi',70],['Maggi','Vegetable Maggi',80],['Pasta','White Sauce Pasta',150],['Pasta','Red Sauce Pasta',150],['Sandwich','Veg Grilled Sandwich',80],['Sandwich','Cheese Corn Sandwich',100],['French Fries','Classic Fries',70],['French Fries','Peri Peri Fries',100],['Burger','Aloo Tikki Burger',70],['Burger','Paneer Burger',90],['Momos','Veg Momos (Steam/Fry)',100],['Momos','Chicken Momos (Steam/Fry)',100],['Coffee','Hot Coffee',50],['Coffee','Cold Coffee',100],['Shake','Chocolate Shake',100],['Shake','Oreo Shake',120],['Pizza','Simple Cheese Pizza',120],['Pizza','Margherita Pizza',140],['Pizza','Chicken Tikka Pizza',180]];let m=JSON.parse(localStorage.getItem('redineMenu')||'null')||base.map((x,i)=>({id:i,cat:x[0],name:x[1],price:x[2],available:true}));let rows=document.querySelector('#rows');function draw(){rows.innerHTML=m.map(x=>`<tr><td>${x.cat}</td><td><input data-k="name" data-i="${x.id}" value="${x.name}"></td><td><input type="number" data-k="price" data-i="${x.id}" value="${x.price}"></td><td><input type="checkbox" data-k="available" data-i="${x.id}" ${x.available?'checked':''}></td></tr>`).join('')}rows.oninput=rows.onchange=e=>{let x=m.find(x=>x.id==e.target.dataset.i);if(!x)return;x[e.target.dataset.k]=e.target.dataset.k==='price'?+e.target.value:e.target.dataset.k==='available'?e.target.checked:e.target.value;localStorage.setItem('redineMenu',JSON.stringify(m));document.querySelector('#note').textContent='Saved ✓'};document.querySelector('#reset').onclick=()=>{localStorage.removeItem('redineMenu');location.reload()};draw()</script></body></html>
